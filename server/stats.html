<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投递统计 · BOSS Helper</title>
<script>
/* 主题在首帧前定好，避免明色闪一下再变深。读取顺序：
   URL ?theme= > localStorage["boss-theme"] > 默认 light。 */
(function () {
  var q = new URLSearchParams(location.search);
  var t = q.get('theme');
  if (t !== 'light' && t !== 'dark') {
    try { t = localStorage.getItem('boss-theme'); } catch (e) { t = null; }
  }
  document.documentElement.classList.toggle('dark', t === 'dark');
})();
</script>
<style>
  /* 明色（默认）：骨架复用主界面中性色，彩色只留给图表 */
  :root{
    --app-bg:#eef0f3; --bg-panel:#ffffff; --bg-raised:#f3f4f6;
    --bg-border:rgba(17,17,19,.1);
    --fg:rgba(17,17,19,.96); --fg-muted:rgba(17,17,19,.58);
    --accent:#18181b; --on-accent:#ffffff;
    --ok:#1a7f37; --warn:#b45309; --bad:#cf222e;
    /* 图表配色（明）：白底上各自够深，不糊成一片 */
    --c-submitted:#2563eb; --c-drafted:#1a7f37; --c-skipped:#8a94a6; --c-ai:#b45309;
    --c-boss:#2563eb; --c-zhaopin:#b45309; --c-collected:#0f766e;
    --c-all:#6d4fc4;
    --c-bar:var(--c-all);
  }
  /* 深色：跟主界面共用 html.dark，骨架 token 与主界面一致 */
  html.dark{
    --app-bg:#0a0a0b; --bg-panel:#101012; --bg-raised:#17171a;
    --bg-border:rgba(255,255,255,.1);
    --fg:rgba(255,255,255,.95); --fg-muted:rgba(255,255,255,.58);
    --accent:#ffffff; --on-accent:#0a0a0b;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --c-submitted:#5b9cf8; --c-drafted:#3fb950; --c-skipped:#4a5262; --c-ai:#d29922;
    --c-boss:#5b9cf8; --c-zhaopin:#d29922; --c-collected:#2dd4bf;
    --c-all:#9070e0;
    --c-bar:var(--c-all);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--app-bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--bg-border);background:var(--bg-panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  .back{color:var(--fg-muted);text-decoration:none;font-size:12px;padding:3px 8px;border:1px solid var(--bg-border);border-radius:6px;white-space:nowrap}
  .back:hover{color:var(--fg);border-color:var(--accent)}
  .tabs{display:flex;gap:4px}
  .tab{padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--fg-muted);font-size:13px;user-select:none}
  .tab:hover{background:var(--bg-raised);color:var(--fg)}
  .tab.on{background:var(--accent);color:var(--on-accent)}
  .filters{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
  select{background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--fg);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;outline:none}
  select:focus{border-color:var(--accent)}
  .theme-btn{background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--fg);border-radius:6px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
  .theme-btn:hover{border-color:var(--accent)}

  main{flex:1;overflow-y:auto;padding:16px 20px 40px}

  /* ── 顶部五个数字 ── */
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--bg-panel);border:1px solid var(--bg-border);border-radius:10px;padding:13px 15px}
  .card .k{font-size:12px;color:var(--fg-muted);display:flex;align-items:center;gap:5px}
  .card .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.2}
  .card .s{font-size:11px;color:var(--fg-muted);margin-top:2px}
  .card.main .v{color:var(--c-submitted)}
  .card.draft .v{color:var(--c-drafted)}

  /* ── 图表 ── */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:1000px){.charts{grid-template-columns:1fr}}
  .chart{background:var(--bg-panel);border:1px solid var(--bg-border);border-radius:10px;padding:14px 16px 10px}
  .chart h2{font-size:13px;margin:0 0 2px;font-weight:600}
  .chart .desc{font-size:11.5px;color:var(--fg-muted);margin:0 0 8px}
  .chart.full{grid-column:1/-1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-muted);margin:6px 0 2px}
  .legend .item{display:flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;flex:none}
  /* 柱子颜色跟随平台，三段用同一色相的深浅区分 */
  .swatch.drafted{background:var(--c-bar)}
  .swatch.submitted{background:var(--c-bar);opacity:.6}
  .swatch.skipped{background:var(--c-bar);opacity:.32}
  .swatch.bar{background:var(--c-bar)}
  .swatch.ai{background:var(--c-ai)}
  .swatch.collected{background:var(--c-collected)}

  svg{display:block;width:100%;overflow:visible}
  .grid line{stroke:var(--bg-border);stroke-width:1}
  .axis line, .axis path{stroke:var(--bg-border);stroke-width:1;fill:none}
  .tick{fill:var(--fg-muted);font-size:10px}
  .bar-label{fill:var(--fg-muted);font-size:9.5px}
  .empty-note{fill:var(--fg-muted);font-size:12px;text-anchor:middle}

  /* ── 热力图：单色蓝阶五档，档位按当前区间最大值等分 ── */
  .heat-wrap{display:flex;gap:6px;align-items:flex-start}
  .heat{display:flex;flex-direction:column;gap:3px}
  .cell{width:13px;height:13px;border-radius:2px;background:var(--bg-raised);border:1px solid var(--bg-border);flex:none}
  .cell.future{background:transparent;border-color:transparent}
  .cell.h0{background:var(--bg-raised)}
  .cell.h1{background:#cfe0f7}.cell.h2{background:#9dc1ef}.cell.h3{background:#6a9fe3}.cell.h4{background:#3d7fd4}.cell.h5{background:#1d5fb8}
  html.dark .cell.h1{background:#14304f}
  html.dark .cell.h2{background:#1e4a7a}
  html.dark .cell.h3{background:#2f6aa8}
  html.dark .cell.h4{background:#4b8fd4}
  html.dark .cell.h5{background:#7fb6f0}
  .heat-scale{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-muted);margin-top:10px}
  .heat-scale .cell{width:11px;height:11px}
  .months{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--fg-muted);text-align:right;flex:none;min-width:30px}
  .mcell{height:13px;line-height:13px;white-space:nowrap}

  .note{font-size:11.5px;color:var(--fg-muted);margin-top:8px;line-height:1.7}
  .note b{color:var(--fg);font-weight:600}
  .err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>投递统计</h1>
  <a class="back" href="/" title="返回助手主界面">← 返回助手</a>
  <div class="tabs" id="ranges">
    <div class="tab" data-r="today">今天</div>
    <div class="tab" data-r="24h">24小时</div>
    <div class="tab on" data-r="7d">7天</div>
    <div class="tab" data-r="30d">30天</div>
    <div class="tab" data-r="all">全部</div>
  </div>
  <div class="filters">
    <select id="platform" title="选择平台"></select>
    <button class="theme-btn" id="theme-toggle" type="button" title="切换明暗主题">深色</button>
  </div>
</header>
<main>
  <div class="cards" id="cards"></div>

  <div class="charts">
    <div class="chart">
      <h2>填写与送达</h2>
      <p class="desc">按时间分桶；草稿贴基线，送达叠在上面，跳过最上</p>
      <div class="legend">
        <span class="item"><span class="swatch drafted"></span>草稿填写（未发送）</span>
        <span class="item"><span class="swatch submitted"></span>已送达（对方收到）</span>
        <span class="item"><span class="swatch skipped"></span>已跳过</span>
        <span class="item"><span class="swatch collected"></span>采集到的岗位</span>
        <span class="item"><span class="swatch bar"></span>柱子颜色跟随所选平台</span>
      </div>
      <div id="bar"></div>
      <p class="note" id="bar-note"></p>
    </div>

    <div class="chart">
      <h2>AI Token 趋势</h2>
      <p class="desc">每个分桶的 token 合计，单位万</p>
      <div class="legend">
        <span class="item"><span class="swatch ai"></span><span id="line-series">token 合计（万）</span></span>
      </div>
      <div id="line"></div>
    </div>

    <div class="chart full">
      <h2>填写 / 送达日历</h2>
      <p class="desc">单色蓝阶：颜色越深，当天填写与送达越多</p>
      <div class="heat-wrap">
        <div class="months" id="heat-months"></div>
        <div class="heat" id="heat"></div>
      </div>
      <div class="heat-scale">
        <span>当天填写 / 送达</span>
        <span class="cell h0"></span><span class="cell h1"></span><span class="cell h2"></span><span class="cell h3"></span><span class="cell h4"></span><span class="cell h5"></span>
        <span>少 → 多</span>
      </div>
      <p class="note" id="heat-note"></p>
    </div>
  </div>

  <p class="note" id="foot"></p>
</main>

<script>
const $ = s => document.querySelector(s);
const state = { range: '7d', platform: 'all', data: null, platforms: [] };

/* ── 主题：跟主界面共用 localStorage["boss-theme"] ─────────────── */
function currentTheme() {
  return document.documentElement.classList.contains('dark') ? 'dark' : 'light';
}

function applyTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark');
  const btn = $('#theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '浅色' : '深色';
}

function initTheme() {
  // head 里的脚本已按 ?theme= > localStorage > light 定好 class；
  // 这里只同步按钮文案并挂上切换。来自 URL 的主题不写回 localStorage。
  applyTheme(currentTheme());
  const btn = $('#theme-toggle');
  if (!btn) return;
  btn.onclick = () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('boss-theme', next); } catch (e) { /* 隐私模式下忽略 */ }
  };
}

const RANGE_LABEL = { today: '今天', '24h': '24小时', '7d': '7天', '30d': '30天', all: '全部' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function fmtMs(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + ' ms';
  return (ms / 1000).toFixed(1) + ' s';
}

/** token 主数字：≥ 1 万显示「25.8 万」，不足万字退回原始整数（不出现「0.0 万」）。 */
function fmtTokens(n) {
  if (n == null) return '—';
  n = Number(n) || 0;
  if (n >= 10000) return (n / 10000).toFixed(1) + ' 万';
  return String(n);
}

/** 副标题里的 token 分项：明确带「万」，为 0 时老实写 0，不写「0.0 万」。 */
function fmtWan(n) {
  n = Number(n) || 0;
  if (!n) return '0';
  const w = n / 10000;
  if (w < 0.05) return n + ' token';
  return w.toFixed(1) + ' 万';
}

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ── 顶部五个数字 ────────────────────────────────────────────── */
function renderCards(d) {
  const t = d.totals || {};
  // 动作完成率：分母是「真的动过手」的次数，闸门拦下的不算失败（ADR-0004）。
  // 它恒为 100%，测的是有没有报错，不是投得成不成。
  const rate = t.success_rate == null ? '—' : Math.round(t.success_rate * 100) + '%';
  const tokTotal = (t.tokens_in || 0) + (t.tokens_out || 0);
  const cards = [
    { cls: 'draft', k: '草稿填写数', v: t.drafted || 0,
      s: `已送达 ${t.submitted || 0}（对方收到）` },
    { cls: '', k: '动作完成率', v: rate,
      s: `${t.attempts || 0} 次动作无一失败` },
    { cls: 'draft', k: '今日草稿', v: t.today_drafted || 0,
      s: `今日已送达 ${t.today_submitted || 0}` },
    { cls: '', k: '平均耗时', v: fmtMs(t.avg_duration_ms),
      s: '单次投递平均' },
    { cls: '', k: 'AI Token', v: tokTotal ? fmtTokens(tokTotal) : '—',
      s: `${t.ai_calls || 0} 次调用 · 入 ${fmtWan(t.tokens_in)} / 出 ${fmtWan(t.tokens_out)}` },
  ];
  $('#cards').innerHTML = cards.map(c => `
    <div class="card ${c.cls}">
      <div class="k">${esc(c.k)}</div>
      <div class="v">${esc(c.v)}</div>
      <div class="s">${esc(c.s)}</div>
    </div>`).join('');
}

/* ── SVG 基础工具 ────────────────────────────────────────────── */
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/** 画网格 + 坐标轴。空数据时也画——否则看起来像加载失败。 */
function drawFrame(svg, { w, h, pad, yMax, yTicks, xLabels, xCount, yFormat }) {
  const g = svgEl('g', { class: 'grid' });
  const plotH = h - pad.t - pad.b;
  const plotW = w - pad.l - pad.r;
  for (let i = 0; i <= yTicks; i++) {
    const v = yMax * i / yTicks;
    const y = pad.t + plotH - plotH * (i / yTicks);
    g.appendChild(svgEl('line', { x1: pad.l, x2: w - pad.r, y1: y, y2: y }));
    const t = svgEl('text', { class: 'tick', x: pad.l - 6, y: y + 3.5, 'text-anchor': 'end' });
    t.textContent = yFormat ? yFormat(v) : Math.round(v);
    g.appendChild(t);
  }
  svg.appendChild(g);

  const ax = svgEl('g', { class: 'axis' });
  ax.appendChild(svgEl('line', { x1: pad.l, x2: w - pad.r, y1: pad.t + plotH, y2: pad.t + plotH }));
  ax.appendChild(svgEl('line', { x1: pad.l, x2: pad.l, y1: pad.t, y2: pad.t + plotH }));
  svg.appendChild(ax);

  // x 轴标签：太密就隔几个显示。小时桶 24 个，只标每 3 小时
  const step = xCount > 20 ? 3 : Math.ceil(xCount / 12);
  (xLabels || []).forEach((lb, i) => {
    if (i % step !== 0 && i !== xCount - 1) return;
    const x = pad.l + (xCount <= 1 ? plotW / 2 : plotW * (i + 0.5) / xCount);
    const t = svgEl('text', { class: 'tick', x: x, y: h - pad.b + 13, 'text-anchor': 'middle' });
    t.textContent = lb;
    svg.appendChild(t);
  });
}

function emptyNote(svg, w, h, text) {
  const t = svgEl('text', { class: 'empty-note', x: w / 2, y: h / 2 });
  t.textContent = text;
  svg.appendChild(t);
}

/** 把纵轴抬到 4 等分的整齐刻度。1/2/2.5/5/10 步进，token 折线要能画小数万。 */
function niceScale(maxV) {
  if (!(maxV > 0)) return { top: 4, step: 1 };
  const rough = maxV / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const m = rough / mag;
  const nice = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
  const step = nice * mag;
  return { top: step * 4, step };
}

/* ── 柱状图：投递量，按平台分色堆叠 ────────────────────────────── */
function renderBar(d) {
  const box = $('#bar');
  box.innerHTML = '';
  // 柱子颜色跟随平台：boss 用 BOSS 蓝，zhaopin 用智联黄，全部平台用中性紫（Q13=A）。
  // 这里的 --c-all 必须跟右柱的 --c-collected 不同色，否则全部平台时两根柱一样紫。
  // 三段用同一色相的深浅区分，图例色块也读这个变量。
  const barFill = state.platform === 'boss' ? 'var(--c-boss)'
    : state.platform === 'zhaopin' ? 'var(--c-zhaopin)'
    : 'var(--c-all)';
  document.documentElement.style.setProperty('--c-bar', barFill);
  const buckets = d.buckets || [];
  const w = 640, h = 260, pad = { t: 14, r: 12, b: 34, l: 40 };
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const svg = svgEl('svg', { viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: 'none' });
  svg.style.height = '260px';

  // 左柱 = 投递量（submitted/drafted/skipped 堆叠），右柱 = 采集到的岗位数。
  // 两者量级差很多（岗位数是几十，投递量是个位数），同轴画的话投递量会被压平，
  // 所以采集量按自己的比例缩放，只用颜色和图例区分，不共用纵轴刻度。
  const totals = buckets.map(b =>
    (b.submitted || 0) + (b.drafted || 0) + (b.skipped || 0));
  const collected = buckets.map(b => b.collected_count || 0);
  const yMax = Math.max(1, ...totals);
  const yStep = Math.max(1, Math.ceil(yMax / 4));
  const top = yStep * Math.max(4, Math.ceil(yMax / yStep));
  const cMax = Math.max(1, ...collected);

  drawFrame(svg, {
    w, h, pad, yMax: top, yTicks: 4,
    xLabels: buckets.map(b => b.label),
    xCount: buckets.length,
    yFormat: v => Math.round(v),
  });

  if (!buckets.length || (!totals.some(v => v > 0) && !collected.some(v => v > 0))) {
    emptyNote(svg, w, h, '暂无数据');
    box.appendChild(svg);
    return;
  }

  const gap = Math.min(10, plotW / buckets.length * 0.3);
  const slot = buckets.length ? (plotW - gap * (buckets.length - 1)) / buckets.length : 0;
  const bw = Math.max(2, slot / 2 - 1);

  buckets.forEach((b, i) => {
    const x0 = pad.l + i * (slot + gap);

    // 左柱：草稿贴基线（最下）→ 送达叠上面 → 跳过最上（ADR-0004）
    let y = pad.t + plotH;
    const stack = [
      { v: b.drafted || 0, cls: 'drafted' },
      { v: b.submitted || 0, cls: 'submitted' },
      { v: b.skipped || 0, cls: 'skipped' },
    ];
    stack.forEach(seg => {
      if (!seg.v) return;
      const hgt = plotH * seg.v / top;
      y -= hgt;
      const opacity = { drafted: 1, submitted: '.6', skipped: '.32' }[seg.cls];
      const rect = svgEl('rect', {
        x: x0, y: y, width: Math.max(1, bw), height: Math.max(1, hgt),
        fill: barFill, opacity, stroke: 'var(--bg-panel)', 'stroke-width': '1', rx: 1.5,
      });
      // 描边区分：草稿用虚线边，光靠色深不够（ADR-0003）
      if (seg.cls === 'drafted') {
        rect.setAttribute('stroke-dasharray', '2 2');
      }
      const title = svgEl('title');
      title.textContent = `${b.label} · ${seg.cls} ${seg.v}`;
      rect.appendChild(title);
      svg.appendChild(rect);
    });

    // 右柱：采集到的岗位数（按自己的量级缩放）
    const nc = b.collected_count || 0;
    if (nc) {
      const hgt = plotH * nc / cMax;
      const rect = svgEl('rect', {
        x: x0 + bw + 2, y: pad.t + plotH - hgt,
        width: Math.max(1, bw), height: Math.max(1, hgt),
        fill: 'var(--c-collected)', rx: 1.5, opacity: '.85',
      });
      const title = svgEl('title');
      title.textContent = `${b.label} · 采集 ${nc} 条岗位`;
      rect.appendChild(title);
      svg.appendChild(rect);
    }
  });

  box.appendChild(svg);
  $('#bar-note').textContent = collected.some(v => v > 0)
    ? `左柱为填写 / 送达量（纵轴），右柱为采集到的岗位数（各自缩放，峰值 ${cMax} 条）；柱子颜色跟随所选平台`
    : '';
}

/* ── 折线图：AI 调用量 + 采集/筛选量 ────────────────────────── */
function renderLine(d) {
  const box = $('#line');
  box.innerHTML = '';
  const buckets = d.buckets || [];
  const w = 640, h = 260, pad = { t: 14, r: 12, b: 34, l: 40 };
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const svg = svgEl('svg', { viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: 'none' });
  svg.style.height = '260px';

  // 主线是每桶 token 合计（万，ADR-0004）；一个 ai_call 事件都没有时
  // 退而画采集/筛选次数，免得整张图是空的（空图看起来像加载失败）。
  const hasAi = buckets.some(b => (b.ai_calls || 0) > 0);
  const series = hasAi
    ? { label: 'token 合计（万）',
        values: buckets.map(b => ((b.tokens_in || 0) + (b.tokens_out || 0)) / 10000) }
    : { label: '采集 + 筛选次数',
        values: buckets.map(b => (b.collects || 0) + (b.screens || 0)) };

  const { top, step } = niceScale(Math.max(...series.values, 0));
  const dec = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;

  drawFrame(svg, {
    w, h, pad, yMax: top, yTicks: 4,
    xLabels: buckets.map(b => b.label),
    xCount: buckets.length,
    yFormat: v => v.toFixed(dec),
  });

  if (!buckets.length || !series.values.some(v => v > 0)) {
    emptyNote(svg, w, h, '暂无数据');
    box.appendChild(svg);
    return;
  }

  const xAt = i => buckets.length <= 1
    ? pad.l + plotW / 2
    : pad.l + plotW * (i + 0.5) / buckets.length;
  const yAt = v => pad.t + plotH - plotH * (v / top);

  const area = svgEl('path', {
    d: `M ${xAt(0)},${pad.t + plotH} L ` + series.values.map((v, i) => `${xAt(i)},${yAt(v)}`).join(' L ')
       + ` L ${xAt(series.values.length - 1)},${pad.t + plotH} Z`,
    fill: 'var(--c-ai)', opacity: '.16',
  });
  svg.appendChild(area);
  svg.appendChild(svgEl('polyline', {
    points: series.values.map((v, i) => `${xAt(i)},${yAt(v)}`).join(' '),
    fill: 'none', stroke: 'var(--c-ai)', 'stroke-width': '2',
    'stroke-linejoin': 'round', 'stroke-linecap': 'round',
  }));
  series.values.forEach((v, i) => {
    const c = svgEl('circle', { cx: xAt(i), cy: yAt(v), r: 2.6, fill: 'var(--c-ai)' });
    const title = svgEl('title');
    const b = buckets[i];
    title.textContent = hasAi
      ? `${b.label} · ${((b.tokens_in || 0) + (b.tokens_out || 0)).toLocaleString()} token`
      : `${b.label} · ${v} 次`;
    c.appendChild(title);
    svg.appendChild(c);
  });

  box.appendChild(svg);
  $('#line-series').textContent = series.label;
}

/* ── 日历热力图 ───────────────────────────────────────────────── */
/** 蓝阶五档：阈值按当前区间最大值等分，不写死。 */
function heatLevel(v, max) {
  if (!v || !max) return 0;
  return Math.min(5, Math.max(1, Math.ceil(v / (max / 5))));
}

/** 日历网格：按周排成行，每行 7 格（周一到周日）。 */
function renderHeat(d) {
  const hm = d.heatmap || { cells: [] };
  const cells = hm.cells || [];
  if (!cells.length) {
    $('#heat').innerHTML = '';
    $('#heat-months').innerHTML = '';
    $('#heat-note').innerHTML = '暂无数据。';
    return;
  }

  // 补齐前面的空格，让每周从周一开始
  const firstDate = new Date(cells[0].date + 'T00:00:00');
  const lead = (firstDate.getDay() + 6) % 7;   // 周一=0

  // 月份刻度：每行 7 格，记录每周第一格属于哪个月
  const weeks = [];
  let cur = [];
  for (let i = 0; i < lead; i++) cur.push(null);
  cells.forEach(c => {
    cur.push(c);
    if (cur.length === 7) { weeks.push(cur); cur = []; }
  });
  if (cur.length) {
    while (cur.length < 7) cur.push(null);
    weeks.push(cur);
  }

  // 网格：每行 7 格。单色蓝阶，深浅 = 当天草稿填写数 + 已送达数。
  const val = c => (c.drafted || 0) + (c.submitted || 0);
  const maxV = Math.max(0, ...cells.map(val));
  const cellHtml = c => {
    if (!c) return '<div class="cell future"></div>';
    const sub = c.submitted || 0, draft = c.drafted || 0;
    const lv = heatLevel(val(c), maxV);
    const title = `${c.date}｜草稿 ${draft}｜已送达 ${sub}｜跳过 ${c.skipped || 0}`;
    return `<div class="cell h${lv}" title="${esc(title)}"></div>`;
  };

  $('#heat').innerHTML = weeks.map(week =>
    `<div style="display:flex;gap:3px">` + week.map(cellHtml).join('') + `</div>`
  ).join('');

  // 月份标签：左边一列，跟着每周第一格走
  $('#heat-months').innerHTML = weeks.map(week => {
    const first = week.find(c => c);
    const m = first ? first.date.slice(0, 7) : '';
    return `<div class="mcell">${m ? m.slice(5) + '月' : ''}</div>`;
  }).join('');

  $('#heat-note').innerHTML =
    `范围 <b>${esc(hm.start)}</b> 到 <b>${esc(hm.end)}</b>，共 ${cells.length} 天，` +
    `每周一行（周一到周日）。颜色深浅为当天草稿填写数与已送达数之和` +
    `（最多 <b>${maxV}</b> 条），按当前区间最大值分五档。`;
}

/* ── 底部说明 ─────────────────────────────────────────────────── */
function renderFoot(d) {
  const t = d.totals || {};
  const bits = [];
  bits.push(`区间 <b>${esc(RANGE_LABEL[d.range] || d.range)}</b>，平台 <b>${esc(d.platform === 'all' ? '全部' : d.platform)}</b>`);
  bits.push(`读入事件 <b>${d.event_count || 0}</b> 条`);
  if (d.bad_lines) bits.push(`跳过坏行 <b>${d.bad_lines}</b> 条`);
  bits.push(`采集 <b>${t.collects || 0}</b> 次，筛选 <b>${t.screens || 0}</b> 次`);
  $('#foot').innerHTML = bits.join(' ｜ ');
}

async function load() {
  try {
    const d = await api(`/api/stats?range=${encodeURIComponent(state.range)}&platform=${encodeURIComponent(state.platform)}`);
    if (!d.ok) throw new Error(d.error || '接口返回失败');
    state.data = d;
    renderCards(d);
    renderBar(d);
    renderLine(d);
    renderHeat(d);
    renderFoot(d);
  } catch (e) {
    $('#cards').innerHTML = `<div class="card"><div class="k">加载失败</div><div class="v err">!</div><div class="s">${esc(e.message)}</div></div>`;
    ['#bar', '#line', '#heat'].forEach(s => $(s).innerHTML = '');
  }
}

function renderPlatformSelect() {
  const sel = $('#platform');
  const opts = [{ name: 'all', display_name: '全部平台' }]
    .concat(state.platforms.map(p => ({ name: p.name, display_name: p.display_name || p.name })));
  sel.innerHTML = opts.map(p =>
    `<option value="${esc(p.name)}"${p.name === state.platform ? ' selected' : ''}>${esc(p.display_name)}</option>`
  ).join('');
}

$('#ranges').querySelectorAll('.tab').forEach(t => t.onclick = () => {
  $('#ranges').querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  state.range = t.dataset.r;
  load();
});

$('#platform').onchange = e => { state.platform = e.target.value; load(); };

async function boot() {
  // 支持 ?range=7d&platform=boss 直接进某个视图，方便分享链接
  const q = new URLSearchParams(location.search);
  const r = q.get('range');
  if (r && RANGE_LABEL[r]) {
    state.range = r;
    $('#ranges').querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.r === r));
  }
  const p = q.get('platform');
  if (p) state.platform = p;

  try {
    const pl = await api('/api/platforms');
    state.platforms = pl.platforms || [];
    renderPlatformSelect();
  } catch (e) {
    /* 平台列表拿不到就只显示「全部」 */
  }
  await load();
}
initTheme();
boot();
</script>

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-helper"
version = "0.2.0"
description = "Manual-mode browser helper for zhipin.com (read current page only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # GUI 运行时
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "websockets>=12.0",
    # 核心引擎
    "requests>=2.28.0",
    "websocket-client>=1.6.0",
    "pyyaml>=6.0",
    "packaging",
    "tracelink",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools]
packages = {find = {where = ["."]}}

[project.urls]
"Homepage" = "https://github.com/yourusername/boss"
